<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Urban Ball Run - Endless urban ball rolling game">
    <title>Urban Ball Run – Realistic Rolling Game</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32x32.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="screen">
        <div class="loader"></div>
        <p class="loading-text">LOADING...</p>
    </div>

    <!-- Start Screen -->
    <div id="start-screen" class="screen hidden">
        <div class="title-container">
            <h1 class="game-title">URBAN BALL RUN</h1>
            <h2 class="game-subtitle">ROLL TO SURVIVE</h2>
        </div>
        <div class="instructions">
            <p class="instruction-title">CONTROLS</p>
            <div class="control-grid">
                <div class="control-item">
                    <span class="key">W/↑</span>
                    <span class="action">Up</span>
                </div>
                <div class="control-item">
                    <span class="key">S/↓</span>
                    <span class="action">Down</span>
                </div>
                <div class="control-item">
                    <span class="key">A/←</span>
                    <span class="action">Left</span>
                </div>
                <div class="control-item">
                    <span class="key">D/→</span>
                    <span class="action">Right</span>
                </div>
            </div>
            <p class="mobile-note">Touch controls available on mobile</p>
        </div>
        <button id="start-btn" class="neon-btn">START GAME</button>
        <button id="sound-toggle" class="neon-btn secondary">🔊 SOUND ON</button>

        <!-- Sales Top Bar -->
        <div class="sales-popup">
            <div class="sales-logo">
                <span class="envato-icon">🍃</span>
                <span class="envato-text"><strong>envato</strong>market</span>
            </div>
            <a href="https://codecanyon.net/item/urban-ball-run-3d-endless-runner-game-crossplatform-html5-game/61368323"
                target="_blank" class="sales-btn">Buy now</a>
        </div>
    </div>

    <!-- Game HUD -->
    <div id="game-hud" class="hidden">
        <div class="hud-top">
            <div class="hud-item">
                <span class="hud-label">SCORE</span>
                <span id="score-value" class="hud-value">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">SPEED</span>
                <span id="speed-value" class="hud-value">100</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">HIGH SCORE</span>
                <span id="highscore-value" class="hud-value">0</span>
            </div>
        </div>

        <!-- Power-up Activation Message -->
        <div id="powerup-message" class="powerup-message hidden">
            <span id="powerup-text"></span>
        </div>

        <!-- Power-up Timer -->
        <div id="powerup-timer" class="powerup-timer hidden">
            <div class="timer-icon">⏱️</div>
            <div class="timer-bar-container">
                <div id="timer-bar" class="timer-bar"></div>
            </div>
            <div id="timer-seconds" class="timer-seconds">10s</div>
        </div>

        <!-- Crash Message -->
        <div id="crash-message" class="crash-message hidden">
            <div class="crash-text">CRASHED!</div>
        </div>

    </div>

    <!-- Game Over Screen -->
    <div id="gameover-screen" class="screen hidden">
        <h1 class="gameover-title">GAME OVER</h1>
        <div class="score-container">
            <div class="final-score">
                <span class="score-label">FINAL SCORE</span>
                <span id="final-score-value" class="score-value">0</span>
            </div>
            <div class="high-score">
                <span class="score-label">HIGH SCORE</span>
                <span id="final-highscore-value" class="score-value">0</span>
            </div>
            <div id="new-record" class="new-record hidden">
                <span class="record-text">🏆 NEW RECORD! 🏆</span>
            </div>
        </div>
        <button id="restart-btn" class="neon-btn">RESTART</button>
        <button id="menu-btn" class="neon-btn secondary">MAIN MENU</button>
    </div>

    <!-- Mobile Touch Controls -->
    <div id="mobile-controls" class="hidden">
        <!-- Touch zones handled in InputController.js -->
        <!-- Touch zones handled in InputController.js -->
    </div>

    <!-- Canvas -->
    <canvas id="game-canvas"></canvas>

    <!-- Three.js Library -->
    <script src="vendor/three.min.js"></script>

    <!-- Error checking -->
    <script>
        if (typeof THREE === 'undefined') {
            console.error('THREE.js failed to load!');
            document.getElementById('loading-screen').innerHTML = '<p style="color: red;">Error: Three.js failed to load. Check your internet connection.</p>';
        } else {
            console.log('THREE.js loaded successfully, version:', THREE.REVISION);
        }
    </script>

    <!-- Game Classes -->
    <script src="js/TextureManager.js"></script>
    <script src="js/AudioManager.js"></script>
    <script src="js/InputController.js"></script>
    <script src="js/Player.js"></script>
    <script src="js/TunnelGenerator.js"></script>
    <script src="js/ObstacleManager.js"></script>
    <script src="js/PowerUpManager.js"></script>
    <script src="js/CollisionDetector.js"></script>
    <script src="js/CameraController.js"></script>
    <script src="js/EffectsManager.js"></script>
    <script src="js/GameManager.js"></script>
    <script src="js/UIManager.js"></script>

    <!-- Main Game -->
    <script src="main.js"></script>
</body>

</html>
